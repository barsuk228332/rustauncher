[package]
name = "rustauncher"
version = "0.1.0"
edition = "2021"
description = "Лёгкий менеджер Wine/Proton префиксов"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.10", features = ["tls", "json"] }
anyhow = "1"
dirs = "5"

# Зависимости собираем с оптимизацией даже в dev — иначе GUI тормозит
[profile.dev.package."*"]
opt-level = 2
